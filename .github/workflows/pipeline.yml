# One pipeline for the whole repo. Each stage gates the next:
#
#   backend tests ─┐                 ┌─ build EC2 artifacts ─┐
#                  ├─ (both green) ──┤                       ├─ deploy+verify classic-ec2 ─┐
#   frontend tests ┘                 └─ build images ────────┤                             ├─ summary
#   IaC checks (classic-ec2, ecs) ───────────────────────────┴─ deploy+verify ecs ─────────┘
#
# Builds happen once and are handed to the deploy jobs as artifacts, like a
# real release pipeline. Every deployment runs on Floci on the runner (no AWS).
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: 22
  TERRAFORM_VERSION: 1.14.6
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  # ── Stage 1: tests and static checks (parallel) ───────────────────────────
  backend:
    name: Backend · vet + unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - name: Start Postgres + Floci (integration test dependencies)
        run: make up
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: Unit + integration tests (race detector, coverage)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://plant:plant@localhost:5432/plant_test?sslmode=disable
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          S3_BUCKET: plant-media
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · lint + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests (Vitest)
        run: npm test

  iac:
    name: IaC · ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stage: [classic-ec2, ecs]
    defaults:
      run:
        working-directory: deployment/${{ matrix.stage }}
    env:
      TF_VAR_image_tag: validate-only
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: terraform init -backend=false -input=false >/dev/null && terraform validate
      - uses: terraform-linters/setup-tflint@v5
      - name: tflint (terraform + aws rulesets)
        run: tflint --config ../.tflint.hcl --init && tflint --config ../.tflint.hcl --format compact
      - name: trivy IaC security scan (HIGH/CRITICAL, accepted findings in .trivyignore)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: deployment/${{ matrix.stage }}
          severity: HIGH,CRITICAL
          trivyignores: deployment/.trivyignore
          exit-code: "1"
      - name: shellcheck
        working-directory: deployment
        run: shellcheck smoke/*.sh classic-ec2/scripts/*.sh classic-ec2/templates/bootstrap.sh

  # ── Stage 2: build once (only after tests pass) ───────────────────────────
  build-ec2-artifacts:
    name: Build · EC2 artifacts
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Go binary (linux/arm64) + React bundle
        run: make -C deployment/classic-ec2 artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ec2-artifacts
          path: |
            deployment/classic-ec2/build/plant-api
            deployment/classic-ec2/build/dist.tar.gz
            frontend/dist
          retention-days: 3

  build-images:
    name: Build · container images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend + frontend images
        run: |
          for svc in backend frontend; do
            docker buildx build --load \
              --cache-from "type=gha,scope=$svc" --cache-to "type=gha,mode=max,scope=$svc" \
              -t "plant/$svc:${IMAGE_TAG}" "$svc"
          done
          docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep plant/ >> "$GITHUB_STEP_SUMMARY"
      - name: trivy image scan (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: plant/backend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy image scan frontend
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: plant/frontend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Save images
        run: docker save "plant/backend:${IMAGE_TAG}" "plant/frontend:${IMAGE_TAG}" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  # ── Stage 3: deploy to Floci and verify (parallel per style) ──────────────
  deploy-classic-ec2:
    name: Deploy+verify · classic-ec2
    needs: [build-ec2-artifacts, iac]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: deployment/classic-ec2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: deployment/smoke/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # The AMI is arm64; runners are x86, so instance containers run under QEMU.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: actions/download-artifact@v5
        with:
          name: ec2-artifacts
          path: .
      - name: Start Floci
        working-directory: .
        run: docker compose up -d --wait floci
      - name: Deploy (bake AMI, terraform apply)
        run: make init && make deploy
      - name: "Verify: ALB targets healthy"
        run: make wait WAIT_TRIES=240
      - name: "Verify: idempotent (plan shows no changes)"
        run: make check
      - name: "Verify: API + browser smoke tests"
        env:
          CI: "true"
        run: make smoke
      - name: Diagnostics
        if: failure()
        run: |
          make -s health || true
          for id in $(terraform output -raw backend_instance_id) $(terraform output -raw frontend_instance_id); do
            echo "::group::user-data $id"; docker exec "floci-ec2-$id" tail -60 /var/log/user-data.log || true; echo "::endgroup::"
          done
          docker compose -f ../../docker-compose.yml logs floci | grep -v ContainerLogStreamer | tail -150
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-classic-ec2
          path: deployment/smoke/playwright-report
          if-no-files-found: ignore
      - name: Destroy
        if: always()
        run: make destroy || true
      - name: "Verify: teardown left nothing running"
        run: |
          left=$(docker ps --format '{{.Names}}' | grep -E '^floci-(ec2|rds)' || true)
          [ -z "$left" ] || { echo "still running: $left"; exit 1; }

  deploy-ecs:
    name: Deploy+verify · ecs
    needs: [build-images, iac]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deployment/ecs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: deployment/smoke/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v5
        with:
          name: images
          path: .
      - name: Load images from the build job
        run: gunzip -c images.tar.gz | docker load
      - name: Start Floci
        working-directory: .
        run: docker compose up -d --wait floci
      - name: Deploy (push to ECR, terraform apply)
        run: make init && make push deploy
      - name: "Verify: ALB targets healthy"
        run: make wait
      - name: "Verify: idempotent (plan shows no changes)"
        run: make check
      - name: "Verify: API + browser smoke tests"
        env:
          CI: "true"
        run: make smoke
      - name: "Verify: rolling deploy (new tag → new revisions, healthy, API smoke)"
        run: make rollout
      - name: Diagnostics
        if: failure()
        run: |
          make -s health || true
          make -s logs || true
          docker compose -f ../../docker-compose.yml logs floci | grep -v ContainerLogStreamer | tail -150
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ecs
          path: deployment/smoke/playwright-report
          if-no-files-found: ignore
      - name: Destroy
        if: always()
        run: make destroy || true
      - name: "Verify: teardown left nothing running"
        run: |
          left=$(docker ps --format '{{.Names}}' | grep -E '^floci-(ecs|rds)' || true)
          [ -z "$left" ] || { echo "still running: $left"; exit 1; }

  # ── Stage 4: one result for branch protection ─────────────────────────────
  summary:
    name: Pipeline summary
    needs: [backend, frontend, iac, build-ec2-artifacts, build-images, deploy-classic-ec2, deploy-ecs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Pipeline result"
            echo "| job | result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
