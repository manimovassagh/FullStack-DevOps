# Pipeline for the AWS stages that run servers or containers: classic-ec2, ecs, eks.
# Each stage gates the next:
#
#   backend tests ─┐                 ┌─ build EC2 artifacts ─┐
#                  ├─ (both green) ──┤                       ├─ deploy+verify classic-ec2 ─┐
#   frontend tests ┘                 └─ build images ────────┼─ deploy+verify ecs ─────────┼─ summary
#   IaC checks (classic-ec2, ecs, eks) ──────────────────────┴─ deploy+verify eks ─────────┘
#
# Builds happen once and are handed to the deploy jobs as artifacts, like a
# real release pipeline. Every deployment runs on Floci on the runner (no AWS).
# The deploy stages are reusable workflows: deploy-classic-ec2.yml, deploy-ecs.yml,
# deploy-eks.yml (keep TERRAFORM_VERSION / NODE_VERSION in sync with their `with:`).
#
# Other deployment families have their own workflow file: serverless.yml.
name: "AWS · EC2 + ECS + EKS"
run-name: "AWS · EC2 + ECS + EKS · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Concurrency is off on purpose: a group made runs wait for / cancel each other, which delayed the start.
# Uncomment if you like: superseded runs of the same branch get cancelled (saves runner minutes,
# but a new push can kill a run that is still in progress).
# concurrency:
#   group: pipeline-${{ github.ref }}
#   cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: 22
  TERRAFORM_VERSION: 1.14.6
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  # ── Stage 1: tests and static checks (parallel) ───────────────────────────
  backend:
    name: Backend · vet + unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - name: Start Postgres + Floci (integration test dependencies)
        run: make up
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: Unit + integration tests (race detector, coverage)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://plant:plant@localhost:5432/plant_test?sslmode=disable
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          S3_BUCKET: plant-media
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · lint + typecheck + unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests (Vitest)
        run: npm test

  iac:
    name: IaC · ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stage: [classic-ec2, ecs, eks]
    defaults:
      run:
        working-directory: deployment/aws/${{ matrix.stage }}
    env:
      TF_VAR_image_tag: validate-only
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: terraform init -backend=false -input=false >/dev/null && terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint (terraform + aws rulesets)
        env:
          # Authenticated plugin download: anonymous GitHub API calls get throttled on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --config ../../.tflint.hcl --init && tflint --config ../../.tflint.hcl --format compact
      - name: trivy IaC security scan (HIGH/CRITICAL, accepted findings in .trivyignore)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deployment/aws/${{ matrix.stage }}
          severity: HIGH,CRITICAL
          trivyignores: deployment/.trivyignore
          exit-code: "1"
      - name: shellcheck
        working-directory: deployment
        run: shellcheck smoke/*.sh aws/classic-ec2/scripts/*.sh aws/classic-ec2/templates/bootstrap.sh aws/eks/scripts/*.sh

  # ── Stage 2: build once (only after tests pass) ───────────────────────────
  build-ec2-artifacts:
    name: Build · EC2 artifacts
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Go binary (linux/arm64) + React bundle
        run: make -C deployment/aws/classic-ec2 artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ec2-artifacts
          path: |
            deployment/aws/classic-ec2/build/plant-api
            deployment/aws/classic-ec2/build/dist.tar.gz
            frontend/dist
          retention-days: 3

  build-images:
    name: Build · container images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend + frontend images
        run: |
          for svc in backend frontend; do
            docker buildx build --load \
              --cache-from "type=gha,scope=$svc" --cache-to "type=gha,mode=max,scope=$svc" \
              -t "plant/$svc:${IMAGE_TAG}" "$svc"
          done
          docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep plant/ >> "$GITHUB_STEP_SUMMARY"
      - name: trivy image scan (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: plant/backend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy image scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: plant/frontend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Save images
        run: docker save "plant/backend:${IMAGE_TAG}" "plant/frontend:${IMAGE_TAG}" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  # ── Stage 3: deploy to Floci and verify (parallel per style) ──────────────
  # Each style lives in its own reusable workflow (deploy-<style>.yml). It runs
  # inside this run, so it reuses the artifacts built above and gates the summary.
  # (`env` isn't available in `with:` of a reusable-workflow call, hence literals.)
  deploy-classic-ec2:
    name: classic-ec2
    needs: [build-ec2-artifacts, iac]
    uses: ./.github/workflows/deploy-classic-ec2.yml
    with:
      terraform_version: 1.14.6
      node_version: "22"

  deploy-ecs:
    name: ecs
    needs: [build-images, iac]
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      image_tag: ci-${{ github.sha }}
      terraform_version: 1.14.6
      node_version: "22"

  deploy-eks:
    name: eks
    needs: [build-images, iac]
    uses: ./.github/workflows/deploy-eks.yml
    with:
      image_tag: ci-${{ github.sha }}
      terraform_version: 1.14.6
      node_version: "22"

  # ── Stage 4: one result for branch protection ─────────────────────────────
  summary:
    name: Pipeline summary
    needs: [backend, frontend, iac, build-ec2-artifacts, build-images, deploy-classic-ec2, deploy-ecs, deploy-eks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Pipeline result"
            echo "| job | result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
