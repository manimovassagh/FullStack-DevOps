# Pipeline for ecs-cloudfront: the most common SPA + container API layout. CloudFront serves the React build from
# a private S3 bucket and forwards /api/* to an ALB that only accepts CloudFront (secret origin header); the API
# runs on ECS Fargate. Runs on the stage's own Floci (a nightly: CloudFront forwards POST/PUT/DELETE).
#
#   backend tests ─┐
#                  ├─ build backend image ─┐
#   frontend tests ┘                       ├─ deploy + verify (API → S3 site → origin lock, smoke, rollout) ─ summary
#   IaC checks ────────────────────────────┘
name: "AWS · ECS + CloudFront + S3"
run-name: "AWS · ECS + CloudFront + S3 · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deployment/aws/ecs-cloudfront/**
      - deployment/smoke/**
      - Makefile
      - docker-compose.yml
      - dev/**
      - .github/workflows/ecs-cloudfront.yml
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - deployment/aws/ecs-cloudfront/**
      - deployment/smoke/**
      - Makefile
      - docker-compose.yml
      - dev/**
      - .github/workflows/ecs-cloudfront.yml
  workflow_dispatch:

# Concurrency is off on purpose: a group made runs wait for / cancel each other, which delayed the start.
# Uncomment if you like: superseded runs of the same branch get cancelled (saves runner minutes,
# but a new push can kill a run that is still in progress).
# concurrency:
#   group: ecs-cloudfront-${{ github.ref }}
#   cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  TERRAFORM_VERSION: 1.14.6
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  # ── Stage 1: tests and static checks (parallel) ───────────────────────────
  backend:
    name: Backend · vet + unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start Postgres + Floci (integration test dependencies)
        run: make up
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: Unit + integration tests (race detector, against Postgres + Floci S3)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://plant:plant@localhost:5432/plant_test?sslmode=disable
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          S3_BUCKET: plant-media
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend · lint + typecheck + unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests (Vitest)
        run: npm test

  iac:
    name: IaC · ecs-cloudfront
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deployment/aws/ecs-cloudfront
    env:
      TF_VAR_image_tag: validate-only
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: terraform init -backend=false -input=false >/dev/null && terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint (terraform + aws rulesets)
        env:
          GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
        run: tflint --config ../../.tflint.hcl --init && tflint --config ../../.tflint.hcl --format compact
      - name: trivy IaC security scan (HIGH/CRITICAL, accepted findings in .trivyignore)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: ${{ github.server_url != 'https://github.com' }}
          scan-type: config
          scan-ref: deployment/aws/ecs-cloudfront
          severity: HIGH,CRITICAL
          trivyignores: deployment/.trivyignore
          exit-code: "1"
      - name: shellcheck
        working-directory: deployment
        run: shellcheck smoke/*.sh aws/ecs-cloudfront/scripts/*.sh

  # ── Stage 2: build once (only after tests pass) ───────────────────────────
  build-images:
    name: Build · container images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: "Build the backend image (the frontend is not an image here: it goes to S3)"
        run: |
          docker buildx build --load -t "plant/backend:${IMAGE_TAG}" backend
          docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep plant/ >> "$GITHUB_STEP_SUMMARY"
      - name: trivy image scan backend (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: ${{ github.server_url != 'https://github.com' }}
          scan-type: image
          image-ref: plant/backend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Save images
        run: docker save "plant/backend:${IMAGE_TAG}" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v7
        if: ${{ github.server_url == 'https://github.com' }}
        with:
          name: images
          path: images.tar.gz
          retention-days: 3
      - uses: christopherhx/gitea-upload-artifact@v4
        if: ${{ github.server_url != 'https://github.com' }}
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  # ── Stage 3: deploy to Floci and verify ───────────────────────────────────
  deploy:
    name: Deploy+verify · ecs-cloudfront
    needs: [build-images, iac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deployment/aws/ecs-cloudfront
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: deployment/smoke/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v8
        if: ${{ github.server_url == 'https://github.com' }}
        with:
          name: images
          path: .
      - uses: christopherhx/gitea-download-artifact@v4
        if: ${{ github.server_url != 'https://github.com' }}
        with:
          name: images
          path: .
      - name: Load images from the build job
        run: gunzip -c "$GITHUB_WORKSPACE/images.tar.gz" | docker load
      - name: "Start this stage's Floci (a nightly: CloudFront forwards every method, :4571)"
        run: make floci
      - name: "Deploy the API (push to ECR, terraform apply: ECS + ALB locked to CloudFront + S3 site + CloudFront)"
        run: make init && make push deploy
      - name: "Deploy the frontend (React build → private S3 bucket → CloudFront invalidation)"
        run: make frontend site
      - name: "Verify: backend target healthy and the app answers through CloudFront"
        run: make wait
      - name: "Verify: idempotent (plan shows no changes)"
        run: make check
      - name: "Verify: ALB refuses everyone but CloudFront + API + browser smoke through CloudFront"
        env:
          CI: "true"
        run: make smoke
      - name: "Verify: rolling deploy (new tag → new revision, healthy, API smoke through CloudFront)"
        run: make rollout
      - name: Diagnostics
        if: failure()
        run: |
          make -s health || true
          make -s logs || true
          docker compose logs floci | grep -v ContainerLogStreamer | tail -150
      - name: Upload e2e recording (Playwright video, screenshots, report)
        uses: actions/upload-artifact@v7
        if: ${{ always() && github.server_url == 'https://github.com' }}
        with:
          name: e2e-recording-ecs-cloudfront
          path: |
            deployment/smoke/test-results
            deployment/smoke/playwright-report
          if-no-files-found: warn
      - name: Upload e2e recording (Playwright video, screenshots, report)
        uses: christopherhx/gitea-upload-artifact@v4
        if: ${{ always() && github.server_url != 'https://github.com' }}
        with:
          name: e2e-recording-ecs-cloudfront
          path: |
            deployment/smoke/test-results
            deployment/smoke/playwright-report
          if-no-files-found: warn
      - name: Destroy
        if: always()
        run: make destroy || true; docker compose down || true
      - name: "Verify: teardown left nothing running"
        run: |
          left=$(docker ps --format '{{.Names}}' | grep -E '^floci-(ecs|rds)' || true)
          [ -z "$left" ] || { echo "still running: $left"; exit 1; }

  # ── Stage 4: one result for this workflow ─────────────────────────────────
  summary:
    name: ECS + CloudFront summary
    needs: [backend, frontend, iac, build-images, deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## ECS + CloudFront summary"
            echo "| job | result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
