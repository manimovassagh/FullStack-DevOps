# Pipeline for the containerised AWS stages: ecs and eks. Both run the same two images, so the
# images are built once here and handed to both deploys. (classic-ec2 is not containerised and has
# its own workflow, ec2.yml; serverless has serverless.yml.)
#
#   backend tests ─┐                 ┌─ deploy+verify ecs ─┐
#                  ├─ build images ──┤                     ├─ summary
#   frontend tests ┘                 └─ deploy+verify eks ─┘
#   IaC checks (ecs, eks) ───────────┘
#
# Builds happen once and are handed to the deploy jobs as artifacts, like a real release pipeline.
# The deploys are reusable workflows (deploy-ecs.yml, deploy-eks.yml); every deployment runs on
# Floci on the runner (no AWS). Keep TERRAFORM_VERSION / NODE_VERSION in sync with their `with:`.
name: "AWS · ECS + EKS (containers)"
run-name: "AWS · ECS + EKS · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
    paths: &paths
      - backend/**
      - frontend/**
      - deployment/smoke/**
      - Makefile
      - docker-compose.yml
      - dev/**
      - deployment/aws/ecs/**
      - deployment/aws/eks/**
      - .github/workflows/containers.yml
      - .github/workflows/deploy-ecs.yml
      - .github/workflows/deploy-eks.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

# Concurrency is off on purpose: a group made runs wait for / cancel each other, which delayed the start.
# Uncomment if you like: superseded runs of the same branch get cancelled (saves runner minutes,
# but a new push can kill a run that is still in progress).
# concurrency:
#   group: containers-${{ github.ref }}
#   cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: 22
  TERRAFORM_VERSION: 1.14.6
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  # ── Stage 1: tests and static checks (parallel) ───────────────────────────
  backend:
    name: Backend · vet + unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - name: Start Postgres + Floci (integration test dependencies)
        run: make up
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: Unit + integration tests (race detector, coverage)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://plant:plant@localhost:5432/plant_test?sslmode=disable
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          S3_BUCKET: plant-media
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · lint + typecheck + unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests (Vitest)
        run: npm test

  iac:
    name: IaC · ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stage: [ecs, eks]
    defaults:
      run:
        working-directory: deployment/aws/${{ matrix.stage }}
    env:
      TF_VAR_image_tag: validate-only
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: terraform init -backend=false -input=false >/dev/null && terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint (terraform + aws rulesets)
        env:
          # Authenticated plugin download: anonymous GitHub API calls get throttled on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --config ../../.tflint.hcl --init && tflint --config ../../.tflint.hcl --format compact
      - name: trivy IaC security scan (HIGH/CRITICAL, accepted findings in .trivyignore)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deployment/aws/${{ matrix.stage }}
          severity: HIGH,CRITICAL
          trivyignores: deployment/.trivyignore
          exit-code: "1"
      - name: shellcheck
        working-directory: deployment
        run: shellcheck smoke/*.sh aws/eks/scripts/*.sh

  # ── Stage 2: build once (only after tests pass) ───────────────────────────
  build-images:
    name: Build · container images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend + frontend images
        run: |
          for svc in backend frontend; do
            docker buildx build --load \
              --cache-from "type=gha,scope=$svc" --cache-to "type=gha,mode=max,scope=$svc" \
              -t "plant/$svc:${IMAGE_TAG}" "$svc"
          done
          docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep plant/ >> "$GITHUB_STEP_SUMMARY"
      - name: trivy image scan (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: plant/backend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy image scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: plant/frontend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Save images
        run: docker save "plant/backend:${IMAGE_TAG}" "plant/frontend:${IMAGE_TAG}" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  # ── Stage 3: deploy to Floci and verify (parallel per style) ──────────────
  # Each style lives in its own reusable workflow (deploy-<style>.yml). It runs inside this run, so it
  # reuses the images built above. (`env` isn't available in `with:` of a call, hence literals.)
  deploy-ecs:
    name: ecs
    needs: [build-images, iac]
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      image_tag: ci-${{ github.sha }}
      terraform_version: 1.14.6
      node_version: "22"

  deploy-eks:
    name: eks
    needs: [build-images, iac]
    uses: ./.github/workflows/deploy-eks.yml
    with:
      image_tag: ci-${{ github.sha }}
      terraform_version: 1.14.6
      node_version: "22"

  # ── Stage 4: one result for this workflow ────────────────────────────────
  summary:
    name: Containers summary
    needs: [backend, frontend, iac, build-images, deploy-ecs, deploy-eks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Containers summary"
            echo "| job | result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
