# Pipeline for the EKS + Helm stage: the same Kubernetes platform as the eks stage, but the app is a Helm
# chart (a versioned release with rollback) instead of Kustomize manifests. Own family, own workflow.
#
#   backend tests ─┐
#                  ├─ build images ─┐
#   frontend tests ┘                ├─ deploy + verify + helm upgrade/rollback ─ summary
#   IaC checks (+ helm lint) ───────┘
name: "AWS · EKS + Helm"
run-name: "AWS · EKS + Helm · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deployment/aws/eks-helm/**
      - deployment/smoke/**
      - Makefile
      - docker-compose.yml
      - dev/**
      - .github/workflows/eks-helm.yml
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - deployment/aws/eks-helm/**
      - deployment/smoke/**
      - Makefile
      - docker-compose.yml
      - dev/**
      - .github/workflows/eks-helm.yml
  workflow_dispatch:

# Concurrency is off on purpose: a group made runs wait for / cancel each other, which delayed the start.
# Uncomment if you like: superseded runs of the same branch get cancelled (saves runner minutes,
# but a new push can kill a run that is still in progress).
# concurrency:
#   group: eks-helm-${{ github.ref }}
#   cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: 22
  TERRAFORM_VERSION: 1.14.6
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  # ── Stage 1: tests and static checks (parallel) ───────────────────────────
  backend:
    name: Backend · vet + unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum
      - name: Start Postgres + Floci (integration test dependencies)
        run: make up
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: Unit + integration tests (race detector, coverage)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://plant:plant@localhost:5432/plant_test?sslmode=disable
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          S3_BUCKET: plant-media
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · lint + typecheck + unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests (Vitest)
        run: npm test

  iac:
    name: IaC · eks-helm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deployment/aws/eks-helm
    env:
      TF_VAR_image_tag: validate-only
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: terraform init -backend=false -input=false >/dev/null && terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint (terraform + aws rulesets)
        env:
          GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
        run: tflint --config ../../.tflint.hcl --init && tflint --config ../../.tflint.hcl --format compact
      - name: trivy IaC security scan (HIGH/CRITICAL, accepted findings in .trivyignore)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: ${{ github.server_url != 'https://github.com' }}
          scan-type: config
          scan-ref: deployment/aws/eks-helm
          severity: HIGH,CRITICAL
          trivyignores: deployment/.trivyignore
          exit-code: "1"
      - uses: azure/setup-helm@v5
      - name: helm lint + template
        run: make lint
      - name: shellcheck
        working-directory: deployment
        run: shellcheck smoke/*.sh aws/eks-helm/scripts/*.sh

  # ── Stage 2: build once (only after tests pass) ───────────────────────────
  build-images:
    name: Build · container images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend + frontend images
        run: |
          for svc in backend frontend; do
            docker buildx build --load \
              --cache-from "type=gha,scope=$svc" --cache-to "type=gha,mode=max,scope=$svc" \
              -t "plant/$svc:${IMAGE_TAG}" "$svc"
          done
          docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep plant/ >> "$GITHUB_STEP_SUMMARY"
      - name: trivy image scan (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: ${{ github.server_url != 'https://github.com' }}
          scan-type: image
          image-ref: plant/backend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy image scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: plant/frontend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Save images
        run: docker save "plant/backend:${IMAGE_TAG}" "plant/frontend:${IMAGE_TAG}" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  # ── Stage 3: deploy to Floci, verify, then walk a whole release ───────────
  deploy:
    name: Deploy+verify · eks-helm
    needs: [build-images, iac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deployment/aws/eks-helm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: deployment/smoke/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.34.1
      - uses: azure/setup-helm@v5
      - uses: actions/download-artifact@v8
        with:
          name: images
          path: .
      - name: Load images from the build job
        run: gunzip -c "$GITHUB_WORKSPACE/images.tar.gz" | docker load
      - name: Start Floci
        working-directory: .
        run: docker compose up -d --wait floci
      - name: "Deploy platform (push to ECR, terraform apply)"
        run: make init && make push deploy
      - name: "Deploy app (kubeconfig, secrets, helm upgrade --install)"
        run: make kubeconfig secrets app
      - name: "Verify: ALB targets healthy"
        run: make register wait
      - name: "Verify: idempotent (plan shows no changes)"
        run: make check
      - name: "Verify: API + browser smoke tests"
        env:
          CI: "true"
        run: make smoke
      - name: "Verify: helm upgrade (revision +1) and helm rollback (revision +1, old image back)"
        run: make rollout
      - name: Diagnostics
        if: failure()
        run: |
          make -s health || true
          make -s history || true
          kubectl get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -40 || true
          docker compose -f ../../../docker-compose.yml logs floci | grep -v ContainerLogStreamer | tail -150
      - name: Upload e2e recording (Playwright video, screenshots, report)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-recording-eks-helm
          path: |
            deployment/smoke/test-results
            deployment/smoke/playwright-report
          if-no-files-found: warn
      - name: Destroy
        if: always()
        run: make destroy || true
      - name: "Verify: teardown left nothing running"
        run: |
          left=$(docker ps --format '{{.Names}}' | grep -E '^floci-(eks|rds)' || true)
          [ -z "$left" ] || { echo "still running: $left"; exit 1; }

  # ── Stage 4: one result for this workflow ─────────────────────────────────
  summary:
    name: EKS Helm summary
    needs: [backend, frontend, iac, build-images, deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## EKS + Helm summary"
            echo "| job | result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
