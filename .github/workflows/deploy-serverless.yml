# Deploy+verify the serverless stage on its own Floci (deployment/serverless/compose.yaml).
# Called by pipeline.yml after the tests and IaC checks pass. It builds what it deploys
# (a Go zip and the React bundle), so it needs no artifacts from the build jobs.
name: deploy-serverless

on:
  workflow_call:
    inputs:
      terraform_version:
        type: string
        required: true
      node_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy+verify · serverless
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deployment/serverless
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-serverless/go.mod
          cache-dependency-path: backend-serverless/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            deployment/smoke/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - name: "Start this stage's Floci, build the function + React app, terraform apply"
        run: make up
      - name: "Verify: idempotent (plan shows no changes)"
        run: make check
      - name: "Verify: API + browser smoke tests"
        env:
          CI: "true"
        run: make smoke
      - name: "Verify: new release goes live (X-Release changes, API smoke passes)"
        run: make rollout
      - name: Diagnostics
        if: failure()
        run: |
          make -s logs || true
          docker compose logs floci | grep -v ContainerLogStreamer | tail -150
      - name: Upload UI test video + screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-video-serverless
          path: |
            deployment/smoke/test-results
            deployment/smoke/playwright-report
          if-no-files-found: warn
      - name: Destroy
        if: always()
        run: make destroy || true
      - name: "Verify: teardown left nothing running"
        run: |
          left=$(docker ps --format '{{.Names}}' | grep -E '^floci-(plant-serverless|rds)' || true)
          [ -z "$left" ] || { echo "still running: $left"; exit 1; }
