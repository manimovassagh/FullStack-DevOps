# Pipeline for the sign-in stage: ECS Fargate + Amazon Cognito (user pool, app client, admin group).
# Its own family: its own backend project (backend-auth: JWT checks, per-user data, sign-in endpoints) and its
# own frontend copy (frontend-auth: login page). Everything runs on Floci on the runner (no AWS).
#
#   backend-auth tests ─┐
#                       ├─ build images ─┐
#   frontend-auth tests ┘                ├─ deploy + verify (sign-in rules, smoke, rollout) ─ summary
#   IaC checks ──────────────────────────┘
name: "AWS · ECS + Cognito"
run-name: "AWS · ECS + Cognito · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
    paths:
      - backend-auth/**
      - frontend-auth/**
      - deployment/aws/ecs-cognito/**
      - deployment/smoke/**
      - Makefile
      - docker-compose.yml
      - dev/**
      - .github/workflows/ecs-cognito.yml
  pull_request:
    paths:
      - backend-auth/**
      - frontend-auth/**
      - deployment/aws/ecs-cognito/**
      - deployment/smoke/**
      - Makefile
      - docker-compose.yml
      - dev/**
      - .github/workflows/ecs-cognito.yml
  workflow_dispatch:

# Concurrency is off on purpose: a group made runs wait for / cancel each other, which delayed the start.
# Uncomment if you like: superseded runs of the same branch get cancelled (saves runner minutes,
# but a new push can kill a run that is still in progress).
# concurrency:
#   group: ecs-cognito-${{ github.ref }}
#   cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  TERRAFORM_VERSION: 1.14.6
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  # ── Stage 1: tests and static checks (parallel) ───────────────────────────
  backend:
    name: Backend (auth) · vet + unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-auth/go.mod
          cache-dependency-path: backend-auth/go.sum
      - name: Start Postgres + Floci (integration test dependencies)
        run: make up
      - name: go vet
        working-directory: backend-auth
        run: go vet ./...
      - name: Unit + integration tests (race detector, owner isolation against Postgres)
        working-directory: backend-auth
        env:
          TEST_DATABASE_URL: postgres://plant:plant@localhost:5432/plant_test?sslmode=disable
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          S3_BUCKET: plant-media
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (auth) · lint + typecheck + unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-auth/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests (Vitest)
        run: npm test

  iac:
    name: IaC · ecs-cognito
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deployment/aws/ecs-cognito
    env:
      TF_VAR_image_tag: validate-only
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: terraform init -backend=false -input=false >/dev/null && terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint (terraform + aws rulesets)
        env:
          GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
        run: tflint --config ../../.tflint.hcl --init && tflint --config ../../.tflint.hcl --format compact
      - name: trivy IaC security scan (HIGH/CRITICAL, accepted findings in .trivyignore)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          token-setup-trivy: ${{ github.server_url == 'https://github.com' && github.token || '' }}
          scan-type: config
          scan-ref: deployment/aws/ecs-cognito
          severity: HIGH,CRITICAL
          trivyignores: deployment/.trivyignore
          exit-code: "1"
      - name: shellcheck
        working-directory: deployment
        run: shellcheck smoke/*.sh aws/ecs-cognito/scripts/*.sh

  # ── Stage 2: build once (only after tests pass) ───────────────────────────
  build-images:
    name: Build · container images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend-auth and frontend-auth images
        run: |
          docker buildx build --load -t "plant/backend-auth:${IMAGE_TAG}" backend-auth
          docker buildx build --load -t "plant/frontend-auth:${IMAGE_TAG}" frontend-auth
          docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep plant/ >> "$GITHUB_STEP_SUMMARY"
      - name: trivy image scan backend-auth (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          token-setup-trivy: ${{ github.server_url == 'https://github.com' && github.token || '' }}
          scan-type: image
          image-ref: plant/backend-auth:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy image scan frontend-auth
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          token-setup-trivy: ${{ github.server_url == 'https://github.com' && github.token || '' }}
          scan-type: image
          image-ref: plant/frontend-auth:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Save images
        run: docker save "plant/backend-auth:${IMAGE_TAG}" "plant/frontend-auth:${IMAGE_TAG}" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  # ── Stage 3: deploy to Floci and verify ───────────────────────────────────
  deploy:
    name: Deploy+verify · ecs-cognito
    needs: [build-images, iac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deployment/aws/ecs-cognito
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: deployment/smoke/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v8
        with:
          name: images
          path: .
      - name: Load images from the build job
        run: gunzip -c "$GITHUB_WORKSPACE/images.tar.gz" | docker load
      - name: Start Floci
        working-directory: .
        run: docker compose up -d --wait floci
      - name: "Deploy (push to ECR, terraform apply: Cognito user pool + the ECS stack)"
        run: make init && make push deploy
      - name: "Verify: ALB targets healthy"
        run: make wait
      - name: "Verify: idempotent (plan shows no changes)"
        run: make check
      - name: "Verify: sign-in rules + API smoke as a user + browser tests with a real login"
        env:
          CI: "true"
        run: make smoke
      - name: "Verify: rolling deploy (new tag → new revisions, healthy, API smoke as a user)"
        run: make rollout
      - name: Diagnostics
        if: failure()
        run: |
          make -s health || true
          make -s logs || true
          docker compose -f ../../../docker-compose.yml logs floci | grep -v ContainerLogStreamer | tail -150
      - name: Upload e2e recording (Playwright video, screenshots, report)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-recording-ecs-cognito
          path: |
            deployment/smoke/test-results
            deployment/smoke/playwright-report
          if-no-files-found: warn
      - name: Destroy
        if: always()
        run: make destroy || true
      - name: "Verify: teardown left nothing running"
        run: |
          left=$(docker ps --format '{{.Names}}' | grep -E '^floci-(ecs|rds)' || true)
          [ -z "$left" ] || { echo "still running: $left"; exit 1; }

  # ── Stage 4: one result for this workflow ─────────────────────────────────
  summary:
    name: ECS + Cognito summary
    needs: [backend, frontend, iac, build-images, deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## ECS + Cognito summary"
            echo "| job | result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
