# Questions an AI should be able to answer from lab-learn, with what the answer must contain.
# `expect` entries must all appear (case-insensitive) in the tool's JSON result: a source path, or a key phrase.
# These run against the real repository (make eval); the score gates CI. Add one whenever a lesson is learned.
- id: alias-rollout
  question: Why did the serverless rollout never move the Lambda alias?
  tool: lessons_for
  args: {topic: "why did the serverless rollout not move the lambda alias"}
  expect: ["serverless-cognito/FLOCI-NOTES.md", "version list order"]
- id: nightly-pin
  question: Why are the serverless stages pinned to Floci nightly-10102026?
  tool: lessons_for
  args: {topic: "why is the serverless stage pinned to floci nightly 10102026"}
  expect: ["serverless-cognito/FLOCI-NOTES.md", "nightly-10102026"]
- id: bind-mount-ci
  question: Why can a CI job not bind-mount the checkout into a container?
  tool: lessons_for
  args: {topic: "why can a ci job not bind mount the checkout"}
  expect: ["ecs-cloudfront-signup-https/FLOCI-NOTES.md", "bind mount"]
- id: tls-local
  question: How is TLS terminated locally for the HTTPS stage?
  tool: search_blueprint
  args: {query: "how is tls terminated locally for the https stage"}
  expect: ["ecs-cloudfront-signup-https"]
- id: simplifications
