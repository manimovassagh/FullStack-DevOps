[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-mcp"
version = "0.1.0"
description = "MCP servers for the Plant Parent cloud lab: lab-learn (read-only knowledge of the blueprint) and lab-operate (guarded control of the local lab)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lab-learn = "lab_mcp.learn.server:main"
lab-operate = "lab_mcp.operate.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab_mcp = ["learn/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
