# The backend's identity in the cluster. On real AWS the role-arn annotation
# (set by `make app` from Terraform output) gives the pod IAM credentials (IRSA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  annotations:
    eks.amazonaws.com/role-arn: BACKEND_ROLE_ARN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } # never drop below 2 ready pods during a rollout
  template:
    metadata:
      labels: { app: backend }
    spec:
      serviceAccountName: backend
      securityContext:
        runAsNonRoot: true # distroless :nonroot image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: backend # replaced with the ECR image by kustomize (make app)
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - name: S3_BUCKET
              valueFrom: { configMapKeyRef: { name: backend-config, key: S3_BUCKET } }
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: backend-config, key: AWS_REGION } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: database, key: DATABASE_URL } }
          # Floci only: endpoint + static keys (see FLOCI-NOTES.md). On real AWS this Secret doesn't exist and IRSA is used.
          envFrom:
            - secretRef: { name: aws-local, optional: true }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
