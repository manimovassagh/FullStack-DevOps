# NodePort: every node listens on a fixed port and forwards to a ready pod.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - { port: 80, targetPort: http, nodePort: {{ .Values.nodePorts.frontend }} }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector: { app: backend }
  ports:
    - { port: 8080, targetPort: http, nodePort: {{ .Values.nodePorts.backend }} }
