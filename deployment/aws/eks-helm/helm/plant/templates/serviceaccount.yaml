# The backend's identity in the cluster. On real AWS the role-arn annotation gives the pod IAM
# credentials (IRSA); on Floci nothing injects them (see FLOCI-NOTES.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  {{- with .Values.backend.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
