apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels: { app: frontend }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      automountServiceAccountToken: false # nginx never talks to the Kubernetes API
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: {{ include "plant.image" (dict "root" . "tier" "frontend") }}
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # nginx master starts as root to bind :80, then workers drop to the nginx user.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE] }
          volumeMounts: # the only paths nginx writes to
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
