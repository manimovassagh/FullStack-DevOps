# This stage's own Floci on :4573, so it touches neither the shared one (4566) nor the other stages' (4567-4571).
#
# HTTPS: the emulator's CloudFront speaks plain HTTP (it has no ACM), so a Caddy in front terminates TLS the way
# CloudFront does on real AWS: https://plant-signup-https.localhost:4443 → Caddy (certificate from mkcert, `make tls`)
# → Floci's CloudFront. The browser, curl and the tests only ever see HTTPS.
#
# Why a separate emulator: the pinned release (2.1.0) answers POST/PUT/DELETE sent through a CloudFront
# distribution with an empty 405, and the API sits behind CloudFront here. The dated nightly forwards them.
name: plant-ecs-cloudfront-signup-https

services:
  floci:
    image: floci/floci:nightly-10012026
    ports:
      - "4573:4566" # Floci API + CloudFront (the app: http://plant-signup-https.localhost:4573)
      - "8100:80"   # the ALB itself, only to show that skipping CloudFront gets 403
    environment:
      # Off on this nightly: it does not turn "allow from the ALB's security group" into a firewall rule for the
      # ALB (which runs inside the Floci container), so health checks time out. Verified 2026-10-09: allowing the
      # Floci IP by hand made both targets healthy. The security groups stay in Terraform for real AWS.
      FLOCI_NETWORK_SECURITY_GROUP_ENFORCEMENT_ENABLED: "false"
      # ECS task containers join this compose network, so the ALB and the RDS proxy reach them.
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: plant-ecs-cloudfront-signup-https_default
      # CloudFront refuses custom origins that resolve to local addresses (SSRF guard); the ALB is local here.
      FLOCI_SERVICES_CLOUDFRONT_ALLOWED_PRIVATE_ORIGIN_HOSTS: localhost
      # Its own ECR registry sidecar: Floci names it floci-aws-ecr-registry by default, so two stages on their own
      # Floci shared one container that only the first Floci could reach (docker login → 503 for the second).
      FLOCI_SERVICES_ECR_REGISTRY_CONTAINER_NAME: floci-ecr-registry-ecs-cloudfront-signup-https
      FLOCI_SERVICES_ECR_REGISTRY_BASE_PORT: "5350"
      FLOCI_SERVICES_ECR_REGISTRY_MAX_PORT: "5399"
      FLOCI_SERVICES_ECR_KEEP_RUNNING_ON_SHUTDOWN: "false" # gone with `docker compose down`, no leftover
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # TLS termination. The certificate comes from `make tls` (mkcert → certs/) and is put into the container by
  # `make floci` with `docker cp` before it starts. Not a bind mount and not a `file:` config (both are bind mounts):
  # inside a CI job container the checkout is not a path on the Docker host, so those would be empty.
  # Only the inline `content:` config below is copied in by compose itself.
  caddy:
    image: caddy:2.8.4-alpine
    depends_on:
      floci:
        condition: service_healthy
    ports:
      - "127.0.0.1:4443:4443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

configs:
  caddyfile:
    content: |
      # TLS in front of the emulator's CloudFront. Certificates come from mkcert (`make tls`); nothing here uses the internet.
      {
      	auto_https off # no ACME, no redirect listener: only :4443 with the mkcert files
      	admin off
      }

      https://plant-signup-https.localhost:4443 {
      	tls /certs/tls.pem /certs/tls-key.pem
      	# What CloudFront's response headers policy does on real AWS (cdn.tf): tell browsers to stay on HTTPS.
      	header Strict-Transport-Security "max-age=3600"
      	reverse_proxy floci:4566 {
      		header_up Host plant-signup-https.localhost  # CloudFront (in Floci) picks the distribution by this name
      		header_up X-Forwarded-Proto https
      	}
      }
