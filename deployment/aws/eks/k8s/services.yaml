# NodePort: every node listens on a fixed port and forwards to a ready pod.
# The ALB target groups (alb.tf) point at <node IP>:<nodePort>.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - { port: 80, targetPort: http, nodePort: 30080 }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector: { app: backend }
  ports:
    - { port: 8080, targetPort: http, nodePort: 30081 }
