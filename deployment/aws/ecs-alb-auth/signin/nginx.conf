# The shared frontend's nginx.conf, plus the hosted login under this app's own address (Floci only).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Floci's stand-in for the Cognito hosted login is bare HTML. Served through here it gets the app's look
    # (signin.css) and the app's light/dark choice (signin-theme.js); the form, its CSRF token and the redirect
    # back are Floci's own. Docker's DNS + a variable: nginx resolves "floci" per request, so this image also
    # starts where there is no Floci (real AWS, where the ALB sends people to the real hosted UI instead).
    location /cognito-idp/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $floci http://floci:4566;
        proxy_pass $floci;
        proxy_set_header Accept-Encoding ""; # sub_filter needs the body uncompressed
        # Floci's policy is default-src 'none', which blocks the added stylesheet, script and fonts. Same strictness,
        # plus this origin's own files (and the inline logo image).
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; img-src data:; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<link rel="stylesheet" href="/signin.css"><script src="/signin-theme.js"></script></head>';
    }

    # React Router: unknown paths are client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
