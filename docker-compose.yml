# Local development dependencies. The Go backend and Vite frontend run on the host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plant
      POSTGRES_PASSWORD: plant
      POSTGRES_DB: plant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plant -d plant"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local AWS emulator. The Docker socket lets Floci run EC2 instances, RDS and
  # ECS tasks as real containers (deployment/ stages).
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
      - "8088:80"   # ALB listener of deployment/classic-ec2 → http://localhost:8088
    environment:
      FLOCI_NETWORK_SECURITY_GROUP_ENFORCEMENT_ENABLED: "true"
      # Our own AMIs (baked systemd Ubuntu image) for the classic-ec2 stage.
      FLOCI_SERVICES_EC2_IMAGE_CATALOG_PATH: /etc/floci/ec2-image-catalog.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deployment/classic-ec2/ami/image-catalog.yaml:/etc/floci/ec2-image-catalog.yaml:ro

volumes:
  pgdata:
