# Local development dependencies. The Go backend and Vite frontend run on the host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plant
      POSTGRES_PASSWORD: plant
      POSTGRES_DB: plant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plant -d plant"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local AWS emulator. The Docker socket lets Floci run EC2 instances, RDS and
  # ECS tasks as real containers (deployment/ stages).
  floci:
    # Pinned: deployment/classic-ec2 depends on 2.1.0 behaviour (see its FLOCI-NOTES.md).
    image: floci/floci:2.1.0
    ports:
      - "4566:4566"
      - "8088:80"   # ALB listener of deployment/classic-ec2 → http://localhost:8088
    environment:
      FLOCI_NETWORK_SECURITY_GROUP_ENFORCEMENT_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
