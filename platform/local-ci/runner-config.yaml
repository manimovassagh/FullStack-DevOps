log:
  level: info
runner:
  file: /data/.runner
  # Up to three jobs at once, like GitHub: inside one pipeline Backend, Frontend and IaC run side by side
  # (about a third faster). Only Backend (Postgres 5432 + Floci 4566) and Deploy bind fixed host ports, and
  # Deploy always waits for Backend. So run ONE pipeline at a time (the panel's Run button, dispatch.sh):
  # two pipelines at once would fight over those ports. Set 1 to be strictly sequential.
  capacity: 3
  timeout: 3h
cache:
  enabled: true
container:
  # Job containers share the Docker host's network, so `localhost:4566` in a workflow reaches the
  # Floci container that the job itself started with `docker compose up`.
  network: host
  privileged: false
  docker_host: ""    # mount the Docker socket into job containers (the jobs run `docker`, `docker compose`, `make`)
  force_pull: false
