log:
  level: info
runner:
  file: /data/.runner
  capacity: 1        # one job at a time: the stages publish fixed ports (4566, 5432, 8088-8096)
  timeout: 3h
cache:
  enabled: true
container:
  # Job containers share the Docker host's network, so `localhost:4566` in a workflow reaches the
  # Floci container that the job itself started with `docker compose up`.
  network: host
  privileged: false
  docker_host: ""    # mount the Docker socket into job containers (the jobs run `docker`, `docker compose`, `make`)
  force_pull: false
